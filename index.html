<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Configuração de viewport para responsividade em dispositivos móveis -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 Kart Racing 3D</title>
<!-- Fontes do Google Fonts para estética futurista/corrida -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">

</head>
<body>
<!-- Canvas principal onde a cena 3D do Three.js é renderizada -->
<canvas id="gl"></canvas>

<!-- HUD (Heads-Up Display) sobreposto ao jogo durante a corrida -->
<div id="hud">
  <!-- Painel Superior Esquerdo: Informações de Tempos e Voltas -->
  <div id="tl">
    <div class="panel"><div class="k">VOLTA</div><div class="v orb" id="lapbig">1/3</div></div>
    <div class="panel"><div class="k">TEMPO DA VOLTA</div><div class="v orb" id="lapTime">0:00.000</div></div>
    <div class="panel"><div class="k">MELHOR VOLTA</div><div class="v orb" id="bestTime" style="color:#c77dff">--:--.---</div></div>
    <div class="panel"><div class="k">ÚLTIMA VOLTA</div><div class="v orb" id="lastTime" style="font-size:17px">--:--.---</div></div>
  </div>
  
  <!-- Painel Superior Direito: Posição e Minimapa -->
  <div id="tr">
    <div class="panel"><span class="k" style="font-size:12px;letter-spacing:2px;color:var(--dim)">POSIÇÃO</span><div id="pos" class="orb">4<small>/4</small></div></div>
    <canvas id="mini" width="180" height="104"></canvas>
  </div>
  
  <!-- Efeitos visuais de largada e avisos no centro da tela -->
  <div id="lights"><div class="l"></div><div class="l"></div><div class="l"></div><div class="l"></div><div class="l"></div></div>
  <div id="go" class="orb">GO!</div>
  <div id="msg"></div>
  
  <!-- Velocímetro analógico/digital e Barra de Boost no canto inferior direito -->
  <div id="speedo">
    <canvas id="gauge" width="460" height="460"></canvas>
    <div id="kmh" class="orb">0</div>
    <div id="kmhu">KM/H</div>
    <div id="boost"><div id="boostf"></div></div>
  </div>
  
  <!-- Dicas de Controles no rodapé -->
  <div id="controls"><b>W</b> Acelerar &nbsp;|&nbsp; <b>S</b> Frear/Ré &nbsp;|&nbsp; <b>A</b>/<b>D</b> Virar &nbsp;|&nbsp; <b>Espaço</b> Drift &nbsp;|&nbsp; <b>R</b> Reiniciar</div>
</div>

<!-- Overlay de Tela de Carregamento -->
<div id="loading" class="ov" style="display:flex">
  <h1 class="orb">F1 <span>KART</span> RACING</h1>
  <h2>CARREGANDO MODELOS 3D…</h2>
  <div id="loadwrap"><div id="loadbar"></div></div>
</div>

<!-- Overlay do Menu Principal de Seleção -->
<div id="menu" class="ov">
  <h1 class="orb">F1 <span>KART</span> RACING</h1>
  <h2>ESCOLHA SEU KART</h2><div class="row" id="kartCards"></div>
  <h2>ESCOLHA SEU PILOTO</h2><div class="row" id="pilotCards"></div>
  <button class="btn" id="startBtn">LARGAR</button>
</div>

<!-- Overlay de Fim de Corrida / Resultados -->
<div id="fin" class="ov">
  <h1 class="orb" id="finTitle">CORRIDA <span>FINALIZADA</span></h1>
  <div class="big orb" id="finPos">P1</div>
  <table id="finTable"></table>
  <button class="btn" id="againBtn">CORRER NOVAMENTE</button>
</div>

<!-- Import Maps para carregar o Three.js via CDN sem gerenciar empacotadores -->
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module" src="./script.js"></script>
</body>
</html>
